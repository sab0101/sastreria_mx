<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#12233A">
  <title>Sastrería - Seguimiento</title>

  <!-- PWA - RUTAS RELATIVAS -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Librerías -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <link rel="stylesheet" href="style.css">

</head>
<body>
  <div id="root"></div>
  <div class="overlay" id="overlay"><div class="modal" id="modalBox"></div></div>
  <div id="printArea"></div>

  <!-- Banner de instalación PWA -->
  <div class="install-banner" id="installBanner">
    <div class="text">
      <span class="icon">✂️</span>
      <span>Instala <b>Sastrería</b> para acceso rápido</span>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <button id="installBtn">📲 Instalar</button>
      <button class="close" id="closeBannerBtn">✕</button>
    </div>
  </div>

  <!-- Botón de instalación flotante (fallback) -->
  <button id="manualInstallBtn">
    📲 Instalar App
  </button>

  <!-- Script principal -->
  <script src="script.js"></script>
</body>
</html>
